openapi: 3.1.0
info:
  title: Server API
  version: v1alpha1
paths:
  /server/v1alpha1/flavors:
    get:
      operationId: list_flavors
      summary: List flavors
      tags:
        - flavors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - flavors
                properties:
                  flavors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Flavor'
  /server/v1alpha1/flavors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: get_flavors
      summary: Get a flavor
      tags:
        - flavors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flavor'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /server/v1alpha1/servers:
    get:
      operationId: list_servers
      summary: List servers
      tags:
        - servers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - servers
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Server'
    post:
      operationId: create_server
      summary: Create a server
      tags:
        - servers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerCreateRequest'
      responses:
        '202':
          $ref: '#/components/responses/JobCreateResponse'
  /server/v1alpha1/servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: get_server
      summary: Get a server
      tags:
        - servers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: update_server
      summary: Update a server
      tags:
        - servers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerUpdateRequest'
      responses:
        '202':
          $ref: '#/components/responses/JobCreateResponse'
    delete:
      operationId: delete_server
      summary: Delete a server. The root volume is retained and not deleted with the server.
      tags:
        - servers
      responses:
        '202':
          $ref: '#/components/responses/JobCreateResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  schemas:
    JobState:
      type: string
      enum:
        - running
        - completed
        - failed
    Job:
      type: object
      description: Async op
      required:
        - state
        - resourceId
      properties:
        state:
          $ref: '#/components/schemas/JobState'
        resourceId:
          type: string
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          description: Machine-readable error type, e.g. "validation_error".
        message:
          type: string
    FlavorArch:
      type: string
      enum:
        - arm64
        - amd64
    Flavor:
      type: object
      required:
        - id
        - name
        - memory
        - cpu
        - arch
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        memory:
          type: string
          examples:
            - 1GiB
        cpu:
          type: number
          format: float
        arch:
          $ref: '#/components/schemas/FlavorArch'
    ServerType:
      type: string
      enum:
        - ephemeral
        - persistent
    ServerState:
      type: string
      enum:
        - pending
        - running
        - updating
        - deleting
        - error
    ServerNetwork:
      type: object
      properties:
        ipv4:
          type: string
          format: ipv4
        port:
          type: integer
    Server:
      type: object
      required:
        - type
        - id
        - name
        - state
        - flavorId
      properties:
        type:
          $ref: '#/components/schemas/ServerType'
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          $ref: '#/components/schemas/ServerState'
        flavorId:
          type: string
          format: uuid
        network:
          $ref: '#/components/schemas/ServerNetwork'
        labels:
          type: object
        availabilityZone:
          type: string
    ServerCreateRequest:
      type: object
      required:
        - type
        - name
        - flavorId
      properties:
        type:
          $ref: '#/components/schemas/ServerType'
        name:
          type: string
        flavorId:
          type: string
          format: uuid
        labels:
          type: object
          additionalProperties:
            type: string
        availabilityZone:
          type: string
    ServerUpdateRequest:
      type: object
      properties:
        name:
          type: string
        flavorId:
          type: string
          format: uuid
        labels:
          type: object
  responses:
    JobCreateResponse:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Job'
    NotFoundError:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
